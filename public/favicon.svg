<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Container with Dark Forest Background -->
  <rect width="64" height="64" rx="14" fill="#0b1d15" stroke="#facc15" stroke-width="2.5"/>

  <!-- Subtle Inner Glow / Border -->
  <rect x="3" y="3" width="58" height="58" rx="12" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>

  <!-- HH Monogram -->
  <g fill="#facc15">
    <!-- Left H Leg -->
    <rect x="14" y="15" width="7" height="26" rx="2.5"/>
    <!-- Right H Leg -->
    <rect x="27" y="15" width="7" height="26" rx="2.5"/>
    <!-- H Crossbar -->
    <rect x="14" y="25" width="20" height="6" rx="1.5"/>
  </g>

  <!-- Palm Tree Silhouette (Goa Vibe) -->
  <g transform="translate(38, 14)">
    <!-- Trunk -->
    <path d="M 6,28 C 7,20 10,12 12,2" stroke="#facc15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Palm Leaves (Teal) -->
    <path d="M 12,2 C 7,0 1,-1 -2,3" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12,2 C 16,-1 21,1 23,5" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12,2 C 6,-4 2,-7 -4,-4" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12,2 C 17,-4 22,-6 26,-3" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12,2 C 10,-6 12,-11 12,-11" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- GOA 2026 Subtext Badge -->
  <rect x="12" y="44" width="40" height="11" rx="3" fill="#2dd4bf"/>
  <text x="32" y="52" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#0b1d15" text-anchor="middle" letter-spacing="1">GOA '26</text>
</svg>